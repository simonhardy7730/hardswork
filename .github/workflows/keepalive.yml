name: Keep-alive & uptime
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" https://wolko.be/api/health || true)
            echo "try $i -> $code"; cat /tmp/out 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
